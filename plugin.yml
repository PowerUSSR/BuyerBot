name: BuyerBot
main: org.mineserver.buyerbot.BuyerBotPlugin
version: 1.0
api-version: 1.20
depend: [Vault, ProtocolLib]
description: Бот-скупщик с ротацией страниц каждые 4 часа

commands:
  buyerbot:
    description: Управление ботом-скупщиком
    permission: buyerbot.admin
    usage: /buyerbot [spawn|skin <ник>|page <1-3>|rotate|info]

permissions:
  buyerbot.admin:
    description: Управление ботом-скупщиком
    default: op
